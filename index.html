/* Layout: one clean white column: date headline and brief, sticky tabs, then a wall of posts (two columns on wide screens). */
:root{
  --bg:#FFFFFF;--ink:#111317;--ink-2:#3F4450;--muted:#6B7080;--line:#E6E7EA;--press:#F3F4F6;--tile-s:65%;--tile:90%;--tile-ink:36%;--edge:rgba(17,19,23,.07);

  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0E10;--ink:#EDEEF0;--ink-2:#B9BDC6;--muted:#8C919C;--line:#25282D;--press:#17191C;--tile-s:38%;--tile:19%;--tile-ink:74%;--edge:rgba(255,255,255,.07);--accent:#6F9BFF;--warn-bg:#2E2410;--warn-ink:#F0CE8A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0E10;--ink:#EDEEF0;--ink-2:#B9BDC6;--muted:#8C919C;--line:#25282D;--press:#17191C;--tile-s:38%;--tile:19%;--tile-ink:74%;--edge:rgba(255,255,255,.07);--accent:#6F9BFF;--warn-bg:#2E2410;--warn-ink:#F0CE8A;color-scheme:dark}

html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:620px;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.mast{padding-block:22px 24px}
.mast h1{margin:2px 0 0;font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.025em}
/* Shows or hides the day's highlights; the choice is remembered on this device. */
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dayrow>div{min-width:0}
.briefbtn{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-right:-14px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.briefbtn svg{width:18px;height:18px}
.briefbtn[aria-expanded="false"] svg{transform:rotate(180deg)}
.stat{margin-top:4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.notice{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px}
/* Today's highlights, each with a topic icon on a softly tinted tile (hue set per topic). */
.brief{display:grid;gap:12px;margin-block:26px 0;padding-block:20px 22px;list-style:none;font-size:15px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.mast:has(.brief:not([hidden])){padding-bottom:0}
.brief li,.brief li>a{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start}
.brief li>a{grid-column:1/-1;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.brief li>a:active{opacity:.7}
.ico{display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:5px;background:hsl(var(--h) var(--tile-s) var(--tile));color:hsl(var(--h) 55% var(--tile-ink))}
.ico svg{width:13px;height:13px}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.navrow{display:flex;align-items:center;gap:12px;max-width:620px;margin:0 auto -1px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip{flex:1;min-width:0;display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
.datebtn,.themebtn{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;padding:0;border:0;background:none;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.datebtn{outline:none}
.themebtn{margin:0 -12px 0 -8px}
.datebtn svg,.themebtn svg{width:18px;height:18px}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;outline:none;opacity:0;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;padding:14px 0 12px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--muted);font:inherit;font-size:17px;font-weight:600;letter-spacing:-.012em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.strip button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

section{padding-block:16px 40px;min-height:60vh}
.empty{margin:8px 0 0;font-size:14px;color:var(--muted)}


/* Switching tabs slides the new list in from the side you're moving to. */
main{overflow-x:clip}
@media (prefers-reduced-motion:no-preference){
  .in-next{animation:in-next .24s ease-out}
  .in-prev{animation:in-prev .24s ease-out}
}
@keyframes in-next{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes in-prev{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}

/* Wall of posts */
.wall{display:grid;gap:34px;margin-top:6px}
.post{display:block;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a.post:active{opacity:.7}
.media{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:5px;background:var(--press);outline:1px solid var(--edge);outline-offset:-1px}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.media img.fit{object-fit:contain;background:#FFFFFF}
.kind{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:rgba(10,11,13,.78);color:#FFFFFF;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.kind svg{flex:none;width:12px;height:12px;margin-left:-2px}
.post-body{display:grid;gap:5px;padding-top:12px}
.post-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12.5px;line-height:1.4;color:var(--muted);font-variant-numeric:tabular-nums}
.post-src{min-width:0;overflow-wrap:anywhere}
.t{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.012em;color:var(--ink);overflow-wrap:anywhere;text-wrap:pretty}
.t .own,.reader-title .own{font-weight:400;color:var(--muted)}
.b{font-size:15px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
@media (min-width:760px){
  .wrap,.navrow,.band .band-in{max-width:1000px}
  .wall{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:40px 28px}
}

.band,.mast{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{border-top:1px solid var(--line)}
.mast{border-bottom:1px solid var(--line)}
.band-in{max-width:620px;margin-inline:auto}
/* Wider screens: header, highlights and tabs run edge to edge with their content lined up with the posts,
   which sit in two and then three columns. Phones keep the single column above. */
@media (min-width:760px){
  html{overflow-x:clip}
  .mast,.band,nav{margin-inline:calc(50% - 50vw)}
  .mast,.band{padding-inline:calc(50vw - 50%)}
  .mast h1{font-size:36px}
  .reader-title{font-size:28px}
  .strip button{font-size:16px}
  .reader-bar .reader-close{line-height:1.6} /* keeps the reader bar as tall as the 16px tabs */
}
@media (min-width:1100px){
  .wrap,.navrow,.band .band-in{max-width:1180px}
  .wall{grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 32px}

@media (hover:hover){a.post:hover .t,.brief a:hover span:last-child{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}}
.install{display:flex;align-items:center;gap:12px;padding-block:18px}
.install img{flex:none;width:36px;height:36px;border-radius:9px}
/* The white app icon would vanish on the white page: show the dark one there, the white one in dark mode. */
.install .on-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .install .on-light{display:none}:root:not([data-theme="light"]) .install .on-dark{display:block}}

:root[data-theme="dark"] .install .on-dark{display:block}
.install-copy{flex:1;min-width:0}
.install-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.install-text{font-size:13px;line-height:1.45;color:var(--muted)}

/* Built like the section tabs (same padding, line box and hairline), so opening an item doesn't shift the bar. */
.reader-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:1;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.reader-bar-in{display:flex;max-width:620px;margin:0 auto -1px}
.reader-close{display:inline-flex;align-items:center;gap:4px;margin-left:-6px;padding:14px 10px 12px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink);font:inherit;font-size:15px;font-weight:500;line-height:1.7;cursor:pointer;-webkit-tap-highlight-color:transparent}

@media (display-mode:standalone){body::before{z-index:40;border-bottom:1px solid var(--line)}} /* installed app: a hairline under the phone's status bar */
.reader-in{max-width:620px;margin:0 auto;padding-top:22px} /* the image sits as far below the bar as the first post below the tabs */
.reader-in .post-meta{margin-top:14px}
.reader-title{margin:20px 0 0;font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.015em;color:var(--ink);overflow-wrap:anywhere;text-wrap:pretty}
.lead{margin:10px 0 0;font-size:16px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.points{display:grid;gap:10px;margin:18px 0 0;padding:18px 0 0 18px;border-top:1px solid var(--line);font-size:15px;line-height:1.55;color:var(--ink);text-wrap:pretty}
.points li::marker{color:var(--muted)}

<script>

}

const pointsOf = item => (Array.isArray(item.points) ? item.points : []).map(p => String(p).trim()).filter(Boolean);

function linkTo(a, item) {

}

  const body = el("div", "post-body");
  body.append(metaOf(item), titleOf(item, "div", "t"));
  if (item.blurb) body.append(el("div", "b", item.blurb));

  return c;
}

// Reader: a picked item's key points in the app's own design, with the original one tap away. Back closes it.

  const arrow = document.createElement("template");
  arrow.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 11 5M6 4.5h5.5V10"/></svg>';

  link.href = href; link.target = "_blank"; link.rel = "noopener noreferrer";
  const list = el("ul", "points");
  list.append(...pointsOf(item).map(p => el("li", "", p)));
  const title = titleOf(item, "h2", "reader-title");
  title.id = "readerTitle";
  $("readerBody").replaceChildren(mediaOf(item, true), metaOf(item), title, ...(item.blurb ? [el("p", "lead", item.blurb)] : []), list, link);
  $("readerBack").textContent = "Back to " + (VIEWS.find(v => v.id === current) || VIEWS[0]).label;
  reader.hidden = false;
  reader.scrollTop = 0;
  document.body.style.overflow = "hidden";
  history.pushState({ reader: true }, "");
}
addEventListener("popstate", () => { reader.hidden = true; document.body.style.overflow = ""; });
$("readerClose").addEventListener("click", () => history.back());
addEventListener("keydown", e => { if (e.key === "Escape" && !reader.hidden) history.back(); });

// Only the selected tab's posts are shown; the choice is remembered on this device.
const store = { get: () => { try { return localStorage.getItem("tab"); } catch { return null; } },
                set: v => { try { localStorage.setItem("tab", v); } catch {} } };
const known = id => VIEWS.some(v => v.id === id) ? id : null;
let current = known(location.hash.slice(1)) || known(store.get()) || "news";

function select(id) {
  const dir = VIEWS.findIndex(v => v.id === id) - VIEWS.findIndex(v => v.id === current);
  current = id;
  store.set(id);
  renderView();
  if (dir) $("main").firstChild.classList.add(dir > 0 ? "in-next" : "in-prev"); // slide in from the side we're moving to
  const top = $("top").offsetTop;
  if (window.scrollY > top) window.scrollTo(0, top);
}

function renderView() {
  $("tabs").replaceChildren(...VIEWS.map(v => {
    const b = el("button", "", v.label);
    b.type = "button";

    b.setAttribute("aria-selected", v.id === current);
    b.addEventListener("click", () => select(v.id));

  sec.setAttribute("role", "tabpanel");
  const items = newestFirst(v.from.flatMap(id => arr(byId[id]).map(i => ({ ...i, src: id }))));
  if (items.length) {
    const wall = el("div", "wall");
    wall.append(...items.map((i, n) => card(i, n < 2)));
    sec.append(wall);
  } else sec.append(el("p", "empty", "Nothing here for this day."));
  $("main").replaceChildren(sec);
}

// Header
const at = new Date(DATA.updatedAt);
const shown = VIEWS.flatMap(v => v.from.flatMap(id => arr(byId[id])));
const total = shown.length;
const minutes = Math.max(1, Math.round(shown.reduce((n, i) => n + `${i.title} ${i.blurb || ""}`.split(/\s+/).length, 0) / 230));
$("day").textContent = longDay(DATA.edition);

  chip: [170, '<rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6.5 2v2M9.5 2v2M6.5 12v2M9.5 12v2M2 6.5h2M2 9.5h2M12 6.5h2M12 9.5h2"/>'],
  price: [35, '<path d="M2.5 8.5v-5a1 1 0 0 1 1-1h5l5 5a1 1 0 0 1 0 1.4l-4.6 4.6a1 1 0 0 1-1.4 0z"/><circle cx="5.5" cy="5.5" r="1"/>'],
  law: [10, '<path d="M8 2.5v11M5.5 13.5h5M3 4.5h10M3 4.5 1.5 8.5a1.6 1.6 0 0 0 3 0zM13 4.5l-1.5 4a1.6 1.6 0 0 0 3 0z"/>'],
  shield: [145, '<path d="M8 2.5 3 4.5v3.5c0 3 2.2 4.8 5 5.5 2.8-.7 5-2.5 5-5.5V4.5z"/>'],
  video: [350, '<rect x="2" y="3.5" width="12" height="9" rx="2"/><path d="M7 6.3v3.4L9.8 8z"/>'],
};
const brief = (Array.isArray(DATA.brief) ? DATA.brief : String(DATA.brief || "").split(/(?<=\.)\s+/))
  .map(l => (l && typeof l === "object" ? l : { text: l }))
  .map(l => ({ icon: ICONS[l.icon] ? l.icon : "news", text: String(l.text || "").trim().replace(/\.$/, ""), url: l.url }))
  .filter(l => l.text);

let briefOpen = true;

showBrief();
const isIndex = !location.pathname.endsWith(DATA.edition + ".html");
const note = isIndex && Date.now() - at > 30 * 3600e3 ? "Last updated " + longDay(DATA.edition) + ". Today's refresh hasn't landed yet." : DATA.note;
if (note) { $("notice").textContent = note; $("notice").hidden = false; }
renderView();

// Horizontal swipes (dir -1 = to the left, 1 = to the right): on the posts they switch tabs; in the reader, a swipe right goes back.
function onSwipe(area, handler) {
  let touch = null;
  area.addEventListener("touchstart", e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY, at: Date.now() }; }, { passive: true });
  area.addEventListener("touchend", e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, quick = Date.now() - touch.at < 800;
    touch = null;
    if (quick && Math.abs(dx) >= 60 && Math.abs(dx) >= 1.5 * Math.abs(dy)) handler(dx < 0 ? -1 : 1);
  }, { passive: true });
}
onSwipe($("main"), dir => { const next = VIEWS[VIEWS.findIndex(v => v.id === current) - dir]; if (next) select(next.id); });
onSwipe(reader, dir => { if (dir > 0 && !reader.hidden) history.back(); });

// Install as an app: Chrome on Android offers its own prompt; iPhone needs Share > Add to Home Screen.
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let installPrompt = null;
const hideInstall = () => { $("install").hidden = true; };
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  if (!standalone) $("install").hidden = false;
});
$("installBtn").addEventListener("click", async () => {
  if (!installPrompt) { // iPhone: installing goes through Safari's Share menu
    $("installText").textContent = "Tap Share, then Add to Home Screen";
    $("installBtn").hidden = true;
    return;
  }
  installPrompt.prompt();
  await installPrompt.userChoice.catch(() => null);
  installPrompt = null;
  hideInstall();
});
addEventListener("appinstalled", hideInstall);
if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) $("install").hidden = false;

// Theme: follows the system until toggled; the choice is remembered on this device.
const root = document.documentElement;
const syncThemeColor = () => { if (root.dataset.theme) document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = root.dataset.theme === "dark" ? "#0D0E10" : "#FFFFFF"; }); };
syncThemeColor();
$("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  syncThemeColor();
});

const openPicker = () => { try { $("pick").showPicker(); } catch { $("pick").focus(); } };

// Past days: archive/days.json lists every saved edition.
const pick = $("pick");
pick.addEventListener("click", openPicker); // desktop browsers open the calendar only on request
pick.value = DATA.edition;
pick.max = DATA.edition;
fetch("archive/days.json", { cache: "no-store" }).then(r => r.ok ? r.json() : []).catch(() => []).then(days => {
  if (!Array.isArray(days) || !days.length) return;
  pick.min = days[0];
  pick.max = days[days.length - 1];
  // Swiping across the header moves one day: to the right for the day before, to the left for the day after.
  onSwipe(document.querySelector(".mast"), dir => {
    const at = days.indexOf(DATA.edition), d = days[at - dir];
    if (at >= 0 && d) location.href = d === days[days.length - 1] ? "index.html" : "archive/" + d + ".html";
  });
  pick.addEventListener("change", () => {
    const d = pick.value;
    if (!d || d === DATA.edition) return;
    if (days.includes(d)) location.href = "archive/" + d + ".html";
    else { $("notice").textContent = "No edition was saved for " + longDay(d) + "."; $("notice").hidden = false; pick.value = DATA.edition; }
  });
});

</script>
